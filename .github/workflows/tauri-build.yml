name: Build Tauri App
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# ========== 加上这一段！重点 ==========
permissions:
  contents: write
# ===================================

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 淘宝npm镜像
        run: npm config set registry https://registry.npmmirror.com

      - name: Install dependencies
        run: npm ci

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: MockForge v__VERSION__
          releaseBody: '自动打包构建，Windows和Mac安装包'
          releaseDraft: true
          prerelease: false
